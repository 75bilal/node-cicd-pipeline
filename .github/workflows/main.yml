# Continuous Integration and Deployment Pipeline
name: cicd pipeline

on:
    # Triggers the workflow on push events but only for the "feature" branch
    push:
        branches: ["feature"]

# A map of environment variables that are available to all jobs and steps in the workflow
env:
    DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/node-app

jobs:
    # This job runs tests and linting
    test:
        runs-on: ubuntu-latest
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout Repository
              uses: actions/checkout@v2
            # Sets up a Node.js environment
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                node-version: 20
            # Installs project dependencies
            - name: Install dependencies
              run: npm install
            # Runs ESLint to check for code quality issues
            - name: Run eslint
              run: npm run lint
            # Runs the test suite
            - name: Run tests
              run: npm run test

    # This job builds the application and runs after the tests have passed
    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout Repository
              uses: actions/checkout@v2
            # Sets up a Node.js environment
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
                node-version: 20
            # Installs project dependencies
            - name: Install dependencies
              run: npm ci
            # Runs the build script if it exists
            - name: Run build
              run: npm run build --if-present
            # Uploads the build artifacts for use in other jobs
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: node-build
                  path: |
                      dist
                      package.json

    # This job builds and pushes a Docker image to Docker Hub
    docker-build:
        runs-on: ubuntu-latest
        needs: build
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout repo
              uses: actions/checkout@v2
            # Logs in to the Docker registry
            - name: Login to Docker Registry
              uses: docker/login-action@v3
              with:
               username: ${{ secrets.DOCKER_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Builds the Docker image and pushes it to the registry
            - name: Build and Push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: |
                    $DOCKER_IMAGE:latest
                     $DOCKER_IMAGE:${{github.sha}}

    # This job scans the Docker image for vulnerabilities using Trivy
    image-scan:
        needs: docker-build
        runs-on: ubuntu-latest
        steps:
        -  name: Scan Docker Image for vulnerabilities
           uses: aquasecurity/trivy-action@master
           with:
              image-ref: ${{ secrets.DOCKER_USERNAME }}/node-app:latest
              format: table
              exit-code: 1
              ignore-unfixed: true
              vuln-type: os,library
